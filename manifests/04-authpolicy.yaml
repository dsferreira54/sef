apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: hello-rbac-jwt-and-roles
  namespace: hello-rbac
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: hello-rbac
  rules:
    authentication:
      keycloak-jwt:
        jwt:
          issuerUrl: https://sso.apps.cluster-vf4dp.dyn.redhatworkshops.io/realms/hello-rbac
    authorization:
      endpoint-role:
        opa:
          rego: |
            allow {
              input.request.path == "/blue"
              input.auth.identity.realm_access.roles[_] == "blue"
            }

            allow {
              input.request.path == "/red"
              input.auth.identity.realm_access.roles[_] == "red"
            }
      source-cidr:
        opa:
          rego: |
            # Authorino receives the IPv4 peer address with its source port.
            source_address := input.context.source.address.Address.SocketAddress.address
            source_ip := split(source_address, ":")[0]

            allow {
              net.cidr_contains("100.64.0.2/32", source_ip)
            }
    response:
      unauthenticated:
        code: 401
        body:
          value: '{"error":"unauthenticated","message":"A valid Keycloak JWT is required."}'
      unauthorized:
        code: 403
        body:
          value: '{"error":"forbidden","message":"The token lacks the role required by this endpoint."}'
