# The VIP is allocated only to the hello-rbac gateway Service. The address must
# be reserved and routable on the node's external L2 network for each cluster.
apiVersion: metallb.io/v1beta1
kind: MetalLB
metadata:
  name: metallb
  namespace: metallb-system
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: hello-gateway-vip
  namespace: metallb-system
spec:
  addresses:
    - 10.10.10.20-10.10.10.20
  autoAssign: false
  serviceAllocation:
    namespaces:
      - hello-rbac
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: hello-gateway-vip
  namespace: metallb-system
spec:
  ipAddressPools:
    - hello-gateway-vip
  serviceSelectors:
    - matchLabels:
        gateway.networking.k8s.io/gateway-name: hello-gateway
